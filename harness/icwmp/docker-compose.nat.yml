# The real client behind a subscriber NAT, for TR-069 Annex G.
#
# Two containers: a NAT (iptables MASQUERADE, a short UDP conntrack
# timeout so the keepalives matter) with a leg on the compose network
# and a leg on an internal subscriber network, and the icwmp harness on
# the subscriber network alone, routing everything through the NAT.
# The harness's ConnectionRequestURL is then an address the ACS cannot
# reach, and the only way in is the binding stunc opens to the ACS's
# STUN server. ACS_URL and STUN_SERVER name the ACS as the NAT's outer
# leg reaches it.
#
#   ACS_URL=http://203.0.113.1:7547/ STUN_SERVER=203.0.113.1 \
#     docker compose -f harness/icwmp/docker-compose.nat.yml up --build
#
# CR_USERNAME and CR_PASSWORD are the connection request credential the
# ACS signs with; the defaults are the OUI and serial joined by a
# hyphen, which is the pair Herder derives for a device it has not
# issued one to.
services:
  nat:
    image: alpine:3.20
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      default: {}
      subscriber:
        ipv4_address: 10.200.0.2
    command:
      - sh
      - -c
      - |
        apk add --no-cache iptables >/dev/null
        out=$$(ip route | awk '/^default/ {print $$5}')
        iptables -t nat -A POSTROUTING -o "$$out" -j MASQUERADE
        sysctl -w net.netfilter.nf_conntrack_udp_timeout=30 || true
        sysctl -w net.netfilter.nf_conntrack_udp_timeout_stream=60 || true
        echo "nat: masquerading subscriber traffic out of $$out"
        sleep infinity

  icwmp:
    build: .
    hostname: icwmp-nat
    cap_add:
      - NET_ADMIN
    depends_on:
      - nat
    networks:
      subscriber:
        ipv4_address: 10.200.0.10
    environment:
      ACS_URL: ${ACS_URL:?the ACS URL as the NAT's outer leg reaches it}
      ACS_USERNAME: ${ACS_USERNAME-iopsys}
      ACS_PASSWORD: ${ACS_PASSWORD-iopsys}
      STUN_SERVER: ${STUN_SERVER:?the STUN server address, the ACS address}
      STUN_PORT: ${STUN_PORT:-3478}
      STUN_MIN_KEEPALIVE: ${STUN_MIN_KEEPALIVE:-10}
      STUN_MAX_KEEPALIVE: ${STUN_MAX_KEEPALIVE:-20}
      GATEWAY: 10.200.0.2
      MANUFACTURER: ${MANUFACTURER:-OpenWrt}
      OUI: ${OUI:-021024}
      SERIAL: ${SERIAL:-OWRTNAT0001}
      PRODUCT_CLASS: ${PRODUCT_CLASS:-DockerCPE}
      MODEL_NAME: ${MODEL_NAME:-icwmp-harness}
      CR_USERNAME: ${CR_USERNAME:-021024-OWRTNAT0001}
      CR_PASSWORD: ${CR_PASSWORD:-021024-OWRTNAT0001}
      INFORM_INTERVAL: ${INFORM_INTERVAL:-120}

networks:
  default: {}
  subscriber:
    internal: true
    ipam:
      config:
        - subnet: 10.200.0.0/24
