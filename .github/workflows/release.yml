name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build and publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      # Archives bundle profiles/ so a download is runnable as-is:
      # tar xzf, then ./cpe-sim --profile=profiles/... and go. Asset names
      # carry no version so the releases/latest/download URL in the README
      # stays copy-pasteable forever.
      - name: Build archives
        run: |
          set -eux
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            bin=cpe-sim; [ "$GOOS" = windows ] && bin=cpe-sim.exe
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w \
                -X github.com/ispx-limited/cpe-labs/internal/version.Version=${{ steps.version.outputs.tag }} \
                -X github.com/ispx-limited/cpe-labs/internal/version.Commit=${{ steps.version.outputs.commit }} \
                -X github.com/ispx-limited/cpe-labs/internal/version.Date=${{ steps.version.outputs.date }}" \
              -o "$bin" ./cmd/cpe-sim
            name="cpe-labs_${GOOS}_${GOARCH}"
            if [ "$GOOS" = windows ]; then
              zip -qr "dist/${name}.zip" "$bin" profiles/
            else
              tar czf "dist/${name}.tar.gz" "$bin" profiles/
            fi
            rm "$bin"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ispxhq/cpe-labs:${{ steps.version.outputs.tag }}
            ispxhq/cpe-labs:latest
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
