# Device.ManagementServer: the ACS binding, with the extra retry and
# STUN leaves this firmware carries. ConnectionRequestURL is
# overwritten by the connection-request listener at start.

groups:
  - prefix: Device.ManagementServer
    parameters:
      - path: EnableCWMP
        type: xsd:boolean
        value: "true"
        writable: true
      - path: URL
        value: "http://acs.example/cwmp"
        writable: true
      - path: Username
        value: "cpe"
        writable: true
      - path: Password
        value: ""
        writable: true
      - path: PeriodicInformEnable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: PeriodicInformInterval
        type: xsd:unsignedInt
        value: "10800"
        writable: true
      - path: PeriodicInformTime
        type: xsd:dateTime
        value: "1970-01-01T06:42:54Z"
        writable: true
      - path: ParameterKey
        value: ""
      - path: ConnectionRequestURL
        value: "http://192.0.2.1:7547/"
      - path: ConnectionRequestUsername
        value: "acs"
        writable: true
      - path: ConnectionRequestPassword
        value: ""
        writable: true
      - path: UpgradesManaged
        type: xsd:boolean
        value: "true"
        writable: true
      - path: KickURL
        value: ""
      - path: DownloadProgressURL
        value: ""
      - path: DefaultActiveNotificationThrottle
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: CWMPRetryMinimumWaitInterval
        type: xsd:unsignedInt
        value: "5"
        writable: true
      - path: CWMPRetryIntervalMultiplier
        type: xsd:unsignedInt
        value: "2000"
        writable: true
      - path: UDPConnectionRequestAddress
        value: ""
      - path: STUNEnable
        type: xsd:boolean
        value: "false"
        writable: true
      - path: STUNServerAddress
        value: ""
        writable: true
      - path: STUNServerPort
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: STUNUsername
        value: ""
        writable: true
      - path: STUNPassword
        value: ""
        writable: true
      - path: STUNMaximumKeepAlivePeriod
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: STUNMinimumKeepAlivePeriod
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: NATDetected
        type: xsd:boolean
        value: "false"
      - path: AliasBasedAddressing
        type: xsd:boolean
        value: "true"
      - path: InstanceMode
        value: "INSTANCENUMBERS"
      - path: AutoCreateInstances
        type: xsd:boolean
        value: "false"
      - path: SupportedConnReqMethods
        value: ""
      - path: ConnReqXMPPConnection
        value: ""
      - path: ConnReqAllowedJabberIDs
        value: ""
      - path: ConnReqJabberID
        value: ""
      - path: ManageableDeviceNotificationLimit
        type: xsd:unsignedInt
        value: "0"
