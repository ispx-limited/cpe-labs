        writable: true
      - path: ParentPrefix
        value: ""
      - path: ChildPrefixBits
        value: ""
      - path: OnLink
        type: xsd:boolean
        value: "false"
      - path: Autonomous
        type: xsd:boolean
        value: "false"
      - path: PreferredLifetime
        type: xsd:dateTime
        value: "2026-01-01T00:00:00Z"
      - path: ValidLifetime
        type: xsd:dateTime
        value: "2026-01-01T00:00:00Z"

  - path: Device.IP.Interface.3.IPv4Address
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Alias
        value: "IP_BR_GUEST_ADDRESS"
        writable: true
      - path: IPAddress
        value: "192.168.201.1"
        writable: true
      - path: SubnetMask
        value: "255.255.255.0"
        writable: true
      - path: AddressingType
        value: "Static"
        writable: true
      - path: Status
