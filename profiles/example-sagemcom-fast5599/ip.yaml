        writable: true
      - path: Alias
        value: "IP_DATA_ADDRESS"
        writable: true
      - path: IPAddress
        value: "{wan_ipv4}"
        writable: true
      - path: SubnetMask
        value: "255.255.255.240"
        writable: true
      - path: AddressingType
        value: "DHCP"
        writable: true
      - path: Status
        value: "Enabled"

  - path: Device.IP.Interface.2.IPv6Address
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Disabled"
      - path: IPAddressStatus
        value: "Unknown"
      - path: Alias
        value: "LINK_LOCAL"
        writable: true
      - path: IPAddress
        value: ""
        writable: true
      - path: Origin
        value: "AutoConfigured"
        writable: true
      - path: Prefix
        value: "Device.IP.Interface.2.IPv6Prefix.1"
        writable: true
      - path: PreferredLifetime
        type: xsd:dateTime
        value: "2026-01-01T00:00:00Z"
      - path: ValidLifetime
        type: xsd:dateTime
        value: "2026-01-01T00:00:00Z"
      - path: Anycast
        type: xsd:boolean
        value: "false"
        writable: true

  - path: Device.IP.Interface.2.IPv6Prefix
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Disabled"
      - path: PrefixStatus
        value: "Invalid"
      - path: Alias
