        value: "true"
      - path: IPv4Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: IPv4Status
        value: "Enabled"
      - path: IPv6Capable
        type: xsd:boolean
        value: "true"
      - path: IPv6Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: IPv6Status
        value: "Enabled"
      - path: ULAPrefix
        value: ""

  - prefix: Device.IP.Interface.1
    parameters:
      - path: Alias
        value: "IP_BR_LAN"
        writable: true
      - path: Name
        value: "Device.IP.Interface.1"
      - path: IPv6Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: ULAEnable
        type: xsd:boolean
        value: "true"
        writable: true

  - prefix: Device.IP.Interface.2
    parameters:
      - path: Alias
