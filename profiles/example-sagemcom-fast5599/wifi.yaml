# Device.WiFi: three radios (2.4, 5 and 6 GHz, all WiFi 7), nine SSIDs
# and nine access points, which is the real shape of this gateway:
# a main network per band, a guest network on 2.4 and 5, a backhaul
# on 5 and 6 for mesh extenders, and a WPA2-only legacy network on
# 2.4 and 5 for clients that cannot do WPA3. Stations sit on the main
# and legacy access points; the backhaul on 6 GHz carries one, the
# extender.
#
# No MultiAP.APDevice and no DataElements: this firmware keeps its
# mesh under Device.WiFi.MultiAP.X_SAGEMCOM_MultiAPConfig, which is
# configuration rather than topology, so the network map an ACS can
# draw from the standard tables is hosts and stations only.
#
# NeighboringWiFiDiagnostic is the standard object with the standard
# Result table; the run is declared in _top.yaml.

