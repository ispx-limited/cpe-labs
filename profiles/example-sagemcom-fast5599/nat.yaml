# Device.NAT: the surveyed unit's three port forwards, internal hosts
# renumbered into the LAN range. Leaf set is what this firmware's
# PortMapping table carries.

parameters:
  - path: Device.NAT.PortMappingNumberOfEntries
    type: xsd:unsignedInt
    value: "3"
  - path: Device.NAT.InterfaceSettingNumberOfEntries
    type: xsd:unsignedInt
    value: "4"

objects:
  - path: Device.NAT.PortMapping
    instances: 3
    parameters:
      - path: RemoteHost
        value: ""
        writable: true
      - path: ExternalPortEndRange
        type: xsd:unsignedInt
        value: "0"
        writable: true

groups:
