        value: "FT_API_DMZ"
        writable: true
      - path: LeaseDuration
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: Protocol
        value: "ALL"
        writable: true
      - path: InternalClient
        value: ""
        writable: true
      - path: Description
        value: ""
        writable: true

  - prefix: Device.NAT.PortMapping.2
