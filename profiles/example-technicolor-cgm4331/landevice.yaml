# InternetGatewayDevice.LANDevice.{i}.*, LAN configuration.
# Arris exposes a single LANDevice instance.

parameters:
  - path: InternetGatewayDevice.LANDeviceNumberOfEntries
    type: xsd:unsignedInt
    value: "1"

# Link state per port, outside the table: the loader rejects a group
# that redeclares a materialized path, so a per-port value cannot be a
# table default with an override. Two ports carry a link and two sit
# empty, which is what most homes look like. NoLink is the TR-098
# vocabulary for an unplugged port.
groups:
  - prefix: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1
    parameters:
      - path: Status
        value: "Up"

  - prefix: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.2
    parameters:
      - path: Status
        value: "Up"

  - prefix: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.3
    parameters:
      - path: Status
        value: "NoLink"

  - prefix: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.4
    parameters:
      - path: Status
        value: "NoLink"

  - prefix: InternetGatewayDevice.LANDevice.1
    parameters:
      - path: LANEthernetInterfaceNumberOfEntries
        type: xsd:unsignedInt
        value: "4"
      - path: LANUSBInterfaceNumberOfEntries
        type: xsd:unsignedInt
        value: "0"
      - path: LANWLANConfigurationNumberOfEntries
        type: xsd:unsignedInt
        value: "2"

  - prefix: InternetGatewayDevice.LANDevice.1.LANHostConfigManagement
    parameters:
      - path: DHCPServerEnable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: DHCPServerConfigurable
        type: xsd:boolean
        value: "true"
      - path: MinAddress
        value: "192.168.1.64"
        writable: true
      - path: MaxAddress
        value: "192.168.1.253"
        writable: true
      - path: SubnetMask
        value: "255.255.255.0"
        writable: true
      - path: IPRouters
        value: "192.168.1.254"
        writable: true
      - path: DNSServers
        value: "192.168.1.254"
        writable: true
      - path: DomainName
        value: "att.net"
        writable: true

# 4-port Ethernet table. Stats byte counters feed an ACS's
# Ethernet telemetry profile; the X_00005E_* link-layer extensions feed
# the Arris vendor telemetry profile. Real NVG firmware reports
# CurrentBitRate/CurrentDuplexMode as strings, and an (empty on
# wired ports) OperatingFrequencyBand.
objects:
  - path: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig
    instances: 4
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: MACAddress
        value: "00:00:5E:00:00:0{i}"
      - path: Stats.BytesSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 2000000
          jitter: 0.3
      - path: Stats.BytesReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 4000000
          jitter: 0.3
      - path: X_00005E_CurrentBitRate
        value: "1000"
      - path: X_00005E_CurrentDuplexMode
        value: "Full"
      - path: X_00005E_OperatingFrequencyBand
        value: ""
        writable: true
