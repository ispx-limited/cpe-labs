# NAT port forwards on the routed WAN connection.
#
# Three of them, because that is what a lived-in home has: a media
# server, a console and a camera, each reachable from outside. A table
# that ships empty is faithful to a gateway fresh out of the box and to
# nothing an ISP ever sees in service. Standard TR-098 leaf set.
#
# The leaves that differ per forward are declared per instance below:
# the loader rejects a group that redeclares a path a table already
# materialized, so a per-row value cannot be a table default with an
# override.

parameters:
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.PortMappingNumberOfEntries
    type: xsd:unsignedInt
    value: "3"

objects:
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.PortMapping
    instances: 3
    parameters:
      - path: PortMappingEnabled
        type: xsd:boolean
        value: "1"
        writable: true
      - path: PortMappingLeaseDuration
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: RemoteHost
        value: ""
        writable: true
      - path: ExternalPortEndRange
        type: xsd:unsignedInt
        value: "0"
        writable: true

groups:
  - prefix: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.PortMapping.1
    parameters:
      - path: PortMappingDescription
        value: "Plex media server"
        writable: true
      - path: PortMappingProtocol
        value: "TCP"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "32400"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "32400"
        writable: true
      - path: InternalClient
        value: "192.168.1.20"
        writable: true
  - prefix: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.PortMapping.2
    parameters:
      - path: PortMappingDescription
        value: "Game console"
        writable: true
      - path: PortMappingProtocol
        value: "UDP"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "3074"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "3074"
        writable: true
      - path: InternalClient
        value: "192.168.1.31"
        writable: true
  - prefix: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.PortMapping.3
    parameters:
      - path: PortMappingDescription
        value: "Home camera"
        writable: true
      - path: PortMappingProtocol
        value: "TCP"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "8443"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "443"
        writable: true
      - path: InternalClient
        value: "192.168.1.40"
        writable: true
