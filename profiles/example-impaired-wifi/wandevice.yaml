# InternetGatewayDevice.WANDevice.{i}.*, WAN configuration.
#
# One WANDevice with one WANConnectionDevice carrying two L3
# connections, the shape most deployed residential firmware presents:
#   WANIPConnection.1  is the data path (DHCP), Connected
#   WANPPPConnection.1 is a PPPoE session for the voice / management
#                        VLAN, with a scripted redial so an ACS sees
#                        realistic PPP flap noise across the fleet
#
# Counters are the point of this file. A real gateway's byte and packet
# totals move continuously, an ACS stores every reported sample, and
# that write path is a large part of what a scale run is measuring.
# Addresses are single documentation-range values rather than per-CPE
# pool allocations: no ACS query path here depends on each device
# holding a distinct routable address, and pools sized for 200k would
# be a fiction anyway.

parameters:
  - path: InternetGatewayDevice.WANDeviceNumberOfEntries
    type: xsd:unsignedInt
    value: "1"
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionNumberOfEntries
    type: xsd:unsignedInt
    value: "1"
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnectionNumberOfEntries
    type: xsd:unsignedInt
    value: "1"
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnectionNumberOfEntries
    type: xsd:unsignedInt
    value: "1"

groups:
  - prefix: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig
    parameters:
      - path: EnabledForInternet
        type: xsd:boolean
        value: "true"
        writable: true
      - path: WANAccessType
        value: "Ethernet"
      - path: Layer1UpstreamMaxBitRate
        type: xsd:unsignedInt
        value: "1000000000"
      - path: Layer1DownstreamMaxBitRate
        type: xsd:unsignedInt
        value: "1000000000"
      - path: PhysicalLinkStatus
        value: "Up"
      - path: MaximumActiveConnections
        type: xsd:unsignedInt
        value: "2"
      - path: TotalBytesSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 12500000
          jitter: 0.2
      - path: TotalBytesReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 25000000
          jitter: 0.2
      - path: TotalPacketsSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 8000
          jitter: 0.3
      - path: TotalPacketsReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 16000
          jitter: 0.3

  - prefix: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.Stats
    parameters:
      - path: EthernetBytesSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 12000000
          jitter: 0.2
      - path: EthernetBytesReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 24000000
          jitter: 0.2
      - path: EthernetPacketsSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 7500
          jitter: 0.3
      - path: EthernetPacketsReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 15000
          jitter: 0.3
      - path: EthernetErrorsSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 60
          jitter: 0.7
      - path: EthernetErrorsReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 110
          jitter: 0.7

  # PPPoE session counters. Voice and management traffic is small next
  # to the data path, so the steps model roughly 100 kbit/s of RTP.
  - prefix: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection.1.Stats
    parameters:
      - path: EthernetBytesSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 375000
          jitter: 0.3
      - path: EthernetBytesReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 375000
          jitter: 0.3
      - path: EthernetPacketsSent
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 1500
          jitter: 0.3
      - path: EthernetPacketsReceived
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: counter
          interval: 30s
          min: 0
          max: 4294967295
          step: 1500
          jitter: 0.3

objects:
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: ConnectionStatus
        value: "Connected"
      - path: ConnectionType
        value: "IP_Routed"
        writable: true
      - path: AddressingType
        value: "DHCP"
        writable: true
      - path: ExternalIPAddress
        value: "203.0.113.10"
      - path: SubnetMask
        value: "255.255.255.0"
      - path: DefaultGateway
        value: "203.0.113.1"
      - path: DNSServers
        value: "192.0.2.53,192.0.2.54"
      - path: DNSEnabled
        type: xsd:boolean
        value: "true"
        writable: true
      # The NIC half of the MAC comes from the global fleet index, so a
      # sharded fleet still produces distinct link-layer identities.
      - path: MACAddress
        value: "00:00:5E:{cpe:mac:3}"
      - path: NATEnabled
        type: xsd:boolean
        value: "true"
        writable: true
      - path: MaxMTUSize
        type: xsd:unsignedInt
        value: "1500"
        writable: true
      - path: Uptime
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: uptime
          interval: 30s
      - path: LastConnectionError
        value: "ERROR_NONE"
      - path: X_00005E_IPv6Address
        value: "2001:db8:1::10"
      - path: X_00005E_DelegatedPrefix
        value: "2001:db8:cafe::/56"
      - path: X_00005E_IPv6Enable
        type: xsd:boolean
        value: "true"
        writable: true

  # WANPPPConnection.{i}: PPPoE session for the voice / management
  # VLAN. ConnectionStatus mostly sits at Connected and cycles through
  # one scripted redial every ten minutes, the fleet-noise shape PPP
  # dashboards care about. Writable on a read-only-in-spec leaf is the
  # simulator convention for generator targets.
  - path: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: ConnectionStatus
        value: "Connected"
        writable: true
        generator:
          type: enum
          interval: 60s
          mode: cycle
          values:
            - "Connected"
            - "Connected"
            - "Connected"
            - "Connected"
            - "Connected"
            - "Connected"
            - "Connected"
            - "Disconnecting"
            - "Disconnected"
            - "Connecting"
      - path: ConnectionType
        value: "IP_Routed"
        writable: true
      - path: TransportType
        value: "PPPoE"
      - path: Uptime
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: uptime
          interval: 30s
      - path: LastConnectionError
        value: "ERROR_NONE"
      - path: ExternalIPAddress
        value: "198.51.100.10"
      - path: DNSServers
        value: "192.0.2.53,192.0.2.54"
      - path: MACAddress
        value: "00:00:5E:{cpe:mac:3}"
      - path: NATEnabled
        type: xsd:boolean
        value: "false"
        writable: true
      - path: Username
        value: "cpe-{cpe:hex:6}@voice.example.net"
        writable: true
      - path: PPPoEACName
        value: "bng-01"
        writable: true
      - path: PPPoEServiceName
        value: "voice"
        writable: true
      - path: MaxMRUSize
        type: xsd:unsignedInt
        value: "1492"
        writable: true
