# Minimal TR-181 profile (modern Device.* root). Loadable via
#
#   bin/cpe-sim --profile=profiles/example-tr181-minimal.yaml
#
# Defaults applied where omitted: type -> xsd:string, writable -> false,
# value -> type-zero (empty for strings, "0" for numerics, etc.).

deviceIdPaths:
  manufacturer: Device.DeviceInfo.Manufacturer
  oui:          Device.DeviceInfo.ManufacturerOUI
  productClass: Device.DeviceInfo.ProductClass
  serialNumber: Device.DeviceInfo.SerialNumber

# periodicInformPaths names the parameter-tree leaves the per-CPE
# scheduler reads to drive its timer. Both fields are required when
# the block is present. Interval must be xsd:unsignedInt + writable;
# enable must be xsd:boolean + writable. Omit the block to run
# bin/cpe-sim in one-shot mode (single bootstrap Inform, then exit
# unless --cr-bind-addr keeps the process alive for connection requests).
periodicInformPaths:
  interval: Device.ManagementServer.PeriodicInformInterval
  enable:   Device.ManagementServer.PeriodicInformEnable

# ACS auth identity read live from the tree, so credential rotation
# via SetParameterValues lands on the next session. Empty values fall
# back to --acs-username/--acs-password.
acsCredentialPaths:
  username: Device.ManagementServer.Username
  password: Device.ManagementServer.Password

# generators makes parameter-tree leaves move over time without ACS
# intervention. Each entry runs on its own profile-fixed interval
# (independent from the periodic Inform interval) and the next periodic
# Inform reports the new value. v0 supports type=counter; future
# stories add drift, enum, timestamp.
generators:
  - path: Device.IP.Interface.1.Stats.BytesSent
    type: counter
    interval: 10s
    min: 0
    max: 4294967295
    step: 1500
    jitter: 0.1

# transfer.firmware enables firmware upgrade simulation on both protocols:
# the CWMP Download RPC (FileType "1 Firmware Upgrade Image") and the USP
# Device.DeviceInfo.FirmwareImage.{i}.Download() / Activate() commands.
# versionPath is the leaf holding the running version; applyDelay is the
# dark window while the device "flashes and reboots".
transfer:
  firmware:
    versionPath: Device.DeviceInfo.SoftwareVersion
    applyDelay: 30s

# softwareModules enables the TR-157 software module lifecycle on both
# protocols: the CWMP ChangeDUState RPC and the USP InstallDU() /
# Update() / Uninstall() commands. An installed app grafts its own data
# model into the tree (see apps/home-hub.yaml) until it is uninstalled.
softwareModules:
  path: Device.SoftwareModules.
  installDelay: 5s
  uninstallDelay: 1s

# informParameters tells the inform builder which parameter paths
# ride along in each event code's Inform ParameterList. The CPE side
# of TR-069 is "vendor-chosen", operators decide which fields are
# worth proactively reporting per event so the ACS doesn't have to
# GPV for them. The simulator picks the right list per session via
# first-matching-event: if a session emits [1 BOOT, 0 BOOTSTRAP],
# the boot list wins when set; otherwise it falls through to
# bootstrap.
#
# Real-vendor patterns this mirrors:
#  - send AddressingType + PPP.Name on bootstrap so the ACS can
#    immediately decide DHCP vs PPP routing without a GPV roundtrip.
#  - send SoftwareVersion / HardwareVersion on bootstrap so the ACS
#    can decide if a firmware push is needed.
#  - send moving counters / uptime on periodic so the ACS dashboard
#    is fed without an explicit poll.
informParameters:
  bootstrap:
    - Device.DeviceInfo.SoftwareVersion
    - Device.DeviceInfo.HardwareVersion
    - Device.DeviceInfo.UpTime
    - Device.IP.Interface.1.IPv4Address
  boot:
    - Device.DeviceInfo.UpTime
  periodic:
    - Device.IP.Interface.1.Stats.BytesSent
    - Device.DeviceInfo.UpTime

parameters:
  # ---- DeviceInfo (read-only identifying parameters) ----
  - path: Device.DeviceInfo.Manufacturer
    value: "ACME Corp"
  - path: Device.DeviceInfo.ManufacturerOUI
    value: "001122"
  - path: Device.DeviceInfo.ProductClass
    value: "HomeGateway"
  - path: Device.DeviceInfo.SerialNumber
    value: "ABC123"
  - path: Device.DeviceInfo.HardwareVersion
    value: "v1.0"
  - path: Device.DeviceInfo.SoftwareVersion
    value: "1.0.0"
  - path: Device.DeviceInfo.UpTime
    type: xsd:unsignedInt
    value: "3600"

  # ---- FirmwareImage (TR-181 Device.DeviceInfo.FirmwareImage.{i}.) ----
  # The instance the USP firmware commands address. The agent walks Status
  # through Downloading / Validating / Available / Active and updates
  # Version and Available itself, so all four leaves stay read-only to the
  # controller.
  - path: Device.DeviceInfo.FirmwareImage.{i}.Name
    instances: 1
    value: "bank-{i}"
  - path: Device.DeviceInfo.FirmwareImage.{i}.Version
    instances: 1
    value: "1.0.0"
  - path: Device.DeviceInfo.FirmwareImage.{i}.Available
    type: xsd:boolean
    instances: 1
    value: "true"
  - path: Device.DeviceInfo.FirmwareImage.{i}.Status
    instances: 1
    value: "Active"

  # ---- SoftwareModules (TR-157): one execution environment, empty
  #      deployment and execution unit tables the lifecycle fills ----
  - path: Device.SoftwareModules.ExecEnvNumberOfEntries
    type: xsd:unsignedInt
    value: "1"
  - path: Device.SoftwareModules.DeploymentUnitNumberOfEntries
    type: xsd:unsignedInt
    value: "0"
  - path: Device.SoftwareModules.ExecutionUnitNumberOfEntries
    type: xsd:unsignedInt
    value: "0"
  - path: Device.SoftwareModules.ExecEnv.{i}.Enable
    type: xsd:boolean
    instances: 1
    value: "true"
    writable: true
  - path: Device.SoftwareModules.ExecEnv.{i}.Status
    instances: 1
    value: "Up"
  - path: Device.SoftwareModules.ExecEnv.{i}.Name
    instances: 1
    value: "containers"
  - path: Device.SoftwareModules.ExecEnv.{i}.Type
    instances: 1
    value: "OCI"
  - path: Device.SoftwareModules.ExecEnv.{i}.Vendor
    instances: 1
    value: "Example"
  - path: Device.SoftwareModules.ExecEnv.{i}.Version
    instances: 1
    value: "1.0"
  - path: Device.SoftwareModules.ExecEnv.{i}.ActiveExecutionUnits
    instances: 1
    value: ""
  - path: Device.SoftwareModules.DeploymentUnit.{i}.UUID
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.DUID
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Name
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Status
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Resolved
    type: xsd:boolean
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.URL
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Description
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Vendor
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Version
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.ExecutionUnitList
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.ExecutionEnvRef
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.Installed
    type: xsd:dateTime
    instances: 0
  - path: Device.SoftwareModules.DeploymentUnit.{i}.LastUpdate
    type: xsd:dateTime
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.EUID
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.Name
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.ExecEnvLabel
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.Status
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.ExecutionFaultCode
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.ExecutionFaultMessage
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.AutoStart
    type: xsd:boolean
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.Vendor
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.Version
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.Description
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.References
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.ExecutionEnvRef
    instances: 0
  - path: Device.SoftwareModules.ExecutionUnit.{i}.CreationTime
    type: xsd:dateTime
    instances: 0

  # ---- ManagementServer (writable so the ACS can update its own URL) ----
  - path: Device.ManagementServer.URL
    value: "http://acs.example/cwmp"
    writable: true
  - path: Device.ManagementServer.Username
    value: "cpe"
    writable: true
  - path: Device.ManagementServer.Password
    value: ""
    writable: true
  - path: Device.ManagementServer.PeriodicInformEnable
    type: xsd:boolean
    value: "true"
    writable: true
  - path: Device.ManagementServer.PeriodicInformInterval
    type: xsd:unsignedInt
    value: "300"
    writable: true
  - path: Device.ManagementServer.ConnectionRequestURL
    value: "http://192.0.2.1:7547/"
    writable: false

  # ---- IP interface (IPv4Address rides bootstrap; BytesSent is the
  #      counter-generator target reported on periodic) ----
  #
  # Status and LastChange are the pair a controller watches to learn a
  # WAN went away and came back: TR-181 counts LastChange in seconds
  # since the interface entered its current state, so the two together
  # date a link event nobody was connected to see.
  - path: Device.IP.Interface.1.Status
    value: "Up"
  - path: Device.IP.Interface.1.LastChange
    type: xsd:unsignedInt
    value: "0"
  - path: Device.IP.Interface.1.IPv4Address
    value: "192.0.2.10"
    writable: true
  - path: Device.IP.Interface.1.Stats.BytesSent
    type: xsd:unsignedInt
    value: "0"
    writable: true

  # ---- WiFi.AccessPoint (variable-arity table; 2 instances at load) ----
  - path: Device.WiFi.AccessPoint.{i}.SSID
    instances: 2
    value: "guest-{i}"
    writable: true
  - path: Device.WiFi.AccessPoint.{i}.Enable
    type: xsd:boolean
    instances: 2
    value: "true"
    writable: true
  - path: Device.WiFi.AccessPoint.{i}.SecurityMode
    instances: 2
    value: "WPA2-Personal"
    writable: true
