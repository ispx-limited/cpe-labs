groups:
  - prefix: Device.DeviceInfo
    parameters:
      - path: Manufacturer
        value: "TP-Link"
      - path: ManufacturerOUI
        value: "00005E"
      - path: ModelName
        value: "EX820v"
      - path: Description
        value: "TP-Link EX820v multi-gig service-provider gateway with voice"
      - path: ProductClass
        value: "EX820v"
      - path: SerialNumber
        value: "BASE"
      - path: HardwareVersion
        value: "1.0"
      # Firmware spreads across the cohort, weighted current with a
      # tail: a fleet on a single build has nothing to upgrade, and
      # campaigns and canary cohorts need a real distribution.
      - path: SoftwareVersion
        value: "{cpe:rpick:1.2.0-0.9.1,1.2.0-0.9.1,1.2.0-0.9.1,1.1.4-0.9.1,1.1.4-0.9.1,1.0.9-0.8.1}"
      - path: AdditionalSoftwareVersion
        value: ""
      - path: SpecVersion
        value: "1.0"
      - path: ProvisioningCode
        value: ""
        writable: true
      - path: UpTime
        type: xsd:unsignedInt
        value: "0"
        writable: true
        generator:
          type: uptime
          interval: 30s
      - path: DeviceLog
        value: ""

  - prefix: Device.DeviceInfo.MemoryStatus
    parameters:
      - path: Total
        type: xsd:unsignedInt
        value: "524288"
      - path: Free
        type: xsd:unsignedInt
        value: "246784"

  - prefix: Device.DeviceInfo.ProcessStatus
    parameters:
      - path: CPUUsage
        type: xsd:unsignedInt
        value: "17"
