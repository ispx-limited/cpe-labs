# Device.ManagementServer: the ACS binding. ConnectionRequestURL is
# overwritten by the connection-request listener at start. An extender
# sits behind its gateway's NAT, so the STUN leaves are here for an ACS
# that reaches it over UDP; a rule or an API write of STUNEnable arms
# the simulator's STUN client.

groups:
  - prefix: Device.ManagementServer
    parameters:
      - path: EnableCWMP
        type: xsd:boolean
        value: "true"
        writable: true
      - path: URL
        value: "http://acs.example/cwmp"
        writable: true
      - path: Username
        value: "cpe"
        writable: true
      - path: Password
        value: ""
        writable: true
      - path: PeriodicInformEnable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: PeriodicInformInterval
        type: xsd:unsignedInt
        value: "900"
        writable: true
      - path: PeriodicInformTime
        type: xsd:dateTime
        value: "1970-01-01T00:00:00Z"
        writable: true
      - path: ParameterKey
        value: ""
      - path: ConnectionRequestURL
        value: "http://192.0.2.1:7547/"
      - path: ConnectionRequestUsername
        value: "acs"
        writable: true
      - path: ConnectionRequestPassword
        value: ""
        writable: true
      - path: UpgradesManaged
        type: xsd:boolean
        value: "true"
        writable: true
      - path: DefaultActiveNotificationThrottle
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: CWMPRetryMinimumWaitInterval
        type: xsd:unsignedInt
        value: "5"
        writable: true
      - path: CWMPRetryIntervalMultiplier
        type: xsd:unsignedInt
        value: "2000"
        writable: true
      - path: UDPConnectionRequestAddress
        value: ""
      - path: STUNEnable
        type: xsd:boolean
        value: "false"
        writable: true
      - path: STUNServerAddress
        value: ""
        writable: true
      - path: STUNServerPort
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: STUNUsername
        value: ""
        writable: true
      - path: STUNPassword
        value: ""
        writable: true
      - path: STUNMaximumKeepAlivePeriod
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: STUNMinimumKeepAlivePeriod
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: NATDetected
        type: xsd:boolean
        value: "true"
