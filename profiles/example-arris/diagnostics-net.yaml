# The TR-098 network diagnostics: ping, traceroute and DNS lookup, the
# trees the live NVG578LX exposes at the IGD root.
#
# The state machines are `diagnostics` entries (an ACS writes Requested,
# the sim works for a moment, the state lands on Complete), and the
# RESULT values are ordinary profile parameters, exactly the split the
# diagnostics engine documents: a given line to a given gateway measures
# roughly the same RTT every run, so redrawing results per run would be
# less realistic, not more. Drift on the RTTs keeps repeated runs from
# being byte-identical.
#
# What a run cannot do here is react to its inputs: the Host an ACS
# writes is echoed back on collect (it is a writable parameter), but
# the canned hops do not change with it. That is the honest limit of
# simulation, and it is fine: what an ACS integration needs to exercise
# is the trigger contract, the wait, the collect and the normalizer.
#
# X_0000C5_IPv6Preferred is here because the vendor ping profile
# (ping-arris in herder-public-configs) writes it: a sim without the
# leaf faults the whole SPV and the action never starts.

parameters:
  # ---- IPPingDiagnostics ----
  - path: InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState
    value: "None"
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.Host
    value: ""
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.Interface
    value: ""
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.NumberOfRepetitions
    type: xsd:unsignedInt
    value: "4"
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.Timeout
    type: xsd:unsignedInt
    value: "1000"
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.DataBlockSize
    type: xsd:unsignedInt
    value: "56"
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.DSCP
    type: xsd:unsignedInt
    value: "0"
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.X_0000C5_IPv6Preferred
    value: "IPv4"
    writable: true
  - path: InternetGatewayDevice.IPPingDiagnostics.SuccessCount
    type: xsd:unsignedInt
    value: "4"
  - path: InternetGatewayDevice.IPPingDiagnostics.FailureCount
    type: xsd:unsignedInt
    value: "0"
  - path: InternetGatewayDevice.IPPingDiagnostics.AverageResponseTime
    type: xsd:int
    value: "12"
    writable: true
    generator:
      type: drift
      interval: 30s
      min: 8
      max: 24
      stepMax: 3
  - path: InternetGatewayDevice.IPPingDiagnostics.MinimumResponseTime
    type: xsd:int
    value: "9"
    writable: true
    generator:
      type: drift
      interval: 30s
      min: 6
      max: 14
      stepMax: 2
  - path: InternetGatewayDevice.IPPingDiagnostics.MaximumResponseTime
    type: xsd:int
    value: "18"
    writable: true
    generator:
      type: drift
      interval: 30s
      min: 14
      max: 40
      stepMax: 4

  # ---- TraceRouteDiagnostics ----
  - path: InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState
    value: "None"
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.Host
    value: ""
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.Interface
    value: ""
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.NumberOfTries
    type: xsd:unsignedInt
    value: "3"
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.Timeout
    type: xsd:unsignedInt
    value: "5000"
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.DataBlockSize
    type: xsd:unsignedInt
    value: "38"
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.DSCP
    type: xsd:unsignedInt
    value: "0"
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.MaxHopCount
    type: xsd:unsignedInt
    value: "30"
    writable: true
  - path: InternetGatewayDevice.TraceRouteDiagnostics.ResponseTime
    type: xsd:int
    value: "460"
    writable: true
    generator:
      type: drift
      interval: 30s
      min: 300
      max: 900
      stepMax: 60
  - path: InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries
    type: xsd:unsignedInt
    value: "0"

  # ---- NSLookupDiagnostics ----
  #
  # No Timeout and no NumberOfRepetitions: the live NVG578LX does not
  # implement them (the spec has them), and the point of this profile
  # is the hardware, not the document.
  - path: InternetGatewayDevice.NSLookupDiagnostics.DiagnosticsState
    value: "None"
    writable: true
  - path: InternetGatewayDevice.NSLookupDiagnostics.HostName
    value: ""
    writable: true
  - path: InternetGatewayDevice.NSLookupDiagnostics.DNSServer
    value: ""
    writable: true
  - path: InternetGatewayDevice.NSLookupDiagnostics.Interface
    value: ""
    writable: true
  - path: InternetGatewayDevice.NSLookupDiagnostics.SuccessCount
    type: xsd:unsignedInt
    value: "1"
  - path: InternetGatewayDevice.NSLookupDiagnostics.ResultNumberOfEntries
    type: xsd:unsignedInt
    value: "0"

objects:
  # Six hops out through the same shape the real capture shows: LAN
  # gateway, carrier hops, destination. Per-hop values vary per CPE so
  # a fleet's traceroutes are not one traceroute repeated.
  - path: InternetGatewayDevice.TraceRouteDiagnostics.RouteHops
    instances: 6
    parameters:
      - path: HopHost
        value: "hop-{i}.sim.example"
      - path: HopHostAddress
        value: ""
      - path: HopErrorCode
        type: xsd:unsignedInt
        value: "0"
      - path: HopRTTimes
        value: "{cpe:pick:11.2,12.8,14.1,9.7,16.3},{cpe:pick:12.0,13.1,14.9,10.2,17.0},{cpe:pick:11.7,12.5,15.2,10.8,16.1}"

  - path: InternetGatewayDevice.NSLookupDiagnostics.Result
    instances: 1
    parameters:
      - path: Status
        value: "Success"
      - path: AnswerType
        value: "NonAuthoritative"
      - path: HostNameReturned
        value: ""
      - path: IPAddresses
        value: "{cpe:ipv4:100.64.0.0/10}"
      - path: DNSServerIP
        value: "192.168.1.254"
      - path: ResponseTime
        type: xsd:unsignedInt
        value: "40"

diagnostics:
  - statePath: InternetGatewayDevice.IPPingDiagnostics.DiagnosticsState
    trigger: Requested
    complete: Complete
    duration: 4s
  - statePath: InternetGatewayDevice.TraceRouteDiagnostics.DiagnosticsState
    trigger: Requested
    complete: Complete
    duration: 8s
    countPath: InternetGatewayDevice.TraceRouteDiagnostics.RouteHopsNumberOfEntries
    resultCount: 6
  - statePath: InternetGatewayDevice.NSLookupDiagnostics.DiagnosticsState
    trigger: Requested
    complete: Complete
    duration: 4s
    countPath: InternetGatewayDevice.NSLookupDiagnostics.ResultNumberOfEntries
    resultCount: 1
