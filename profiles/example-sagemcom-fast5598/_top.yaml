# Sagemcom Fast 5598, TR-181 (Device.*) profile.
# Modeled on a real device CSV export (TR-181 with Sagemcom OUI ECFC2F).

deviceIdPaths:
  manufacturer: Device.DeviceInfo.Manufacturer
  oui:          Device.DeviceInfo.ManufacturerOUI
  productClass: Device.DeviceInfo.ProductClass
  serialNumber: Device.DeviceInfo.SerialNumber

fleet:
  count: 1
  # Sagemcom-style shape: 2-letter factory prefix + YYWW date code +
  # 8-char alphanumeric tail. {cpe:ALNUM:8} draws the tail from the
  # per-CPE seeded RNG, so serials look real instead of a zero-padded
  # counter, stay stable for a given --seed, and stay unique across
  # the fleet. Changing the pattern on an existing deployment mints
  # new device identities at the ACS (identity is OUI plus serial).
  serialPattern: "XU2033{cpe:ALNUM:8}"
  pools:
    wan_ipv4:
      type: ipv4
      # CGNAT space rather than a doc /24: the pool must reach every
      # fleet offset a manifest cohort can take, and /10 holds four
      # million homes. Also what a real access network hands a CPE.
      cidr: "100.64.0.0/10"
    wan_ipv6:
      type: ipv6
      cidr: "2001:db8:2::/64"          # RFC 3849 doc range
    delegated_prefix:
      type: ipv6prefix
      # A /36 super so the pool holds a six-figure fleet: /56 per home
      # gives 2^20 prefixes, and manifest cohorts take offsets well
      # past the 256 a /48 super allowed.
      super: "2001:db8:b000::/36"
      sublen: 56                       # /56 per CPE

periodicInformPaths:
  interval: Device.ManagementServer.PeriodicInformInterval
  enable:   Device.ManagementServer.PeriodicInformEnable

# ACS auth identity read live from the tree, so credential rotation
# via SetParameterValues lands on the next session. Empty values fall
# back to --acs-username/--acs-password.
acsCredentialPaths:
  username: Device.ManagementServer.Username
  password: Device.ManagementServer.Password

# A Download with FileType "1 Firmware Upgrade Image" is applied for
# real: the image is fetched, its declared version written to
# versionPath after a dark window, and announced in a boot session. An
# ACS campaign against this profile therefore changes what the device
# reports, which is what a compliance finding or a catalogue count is
# read against.
transfer:
  firmware:
    versionPath: Device.DeviceInfo.SoftwareVersion
    applyDelay: 60s
    fetch: true

informParameters:
  bootstrap:
    - Device.DeviceInfo.Manufacturer
    - Device.DeviceInfo.ManufacturerOUI
    - Device.DeviceInfo.ModelName
    - Device.DeviceInfo.ProductClass
    - Device.DeviceInfo.SerialNumber
    - Device.DeviceInfo.HardwareVersion
    - Device.DeviceInfo.SoftwareVersion
    - Device.ManagementServer.URL
    - Device.ManagementServer.ParameterKey
    - Device.PPP.Interface.1.Status
    - Device.PPP.Interface.1.Username
    - Device.IP.Interface.2.IPv4Address.1.IPAddress
  boot:
    # SoftwareVersion is a forced Inform parameter (TR-069 Annex A),
    # and it is the boot after a firmware Download where it matters:
    # without it the ACS learns the new build on the next periodic
    # Inform, up to an interval later.
    - Device.DeviceInfo.SoftwareVersion
    - Device.DeviceInfo.UpTime
  periodic:
    - Device.DeviceInfo.SoftwareVersion
    - Device.DeviceInfo.UpTime
    - Device.Ethernet.Interface.1.Stats.BytesSent
    - Device.Ethernet.Interface.1.Stats.BytesReceived
    - Device.WiFi.SSID.1.Stats.BytesSent
    - Device.WiFi.SSID.1.Stats.BytesReceived
    - Device.WiFi.SSID.2.Stats.BytesSent
    - Device.WiFi.SSID.2.Stats.BytesReceived
  valueChange:
    - Device.WiFi.AccessPoint.1.AssociatedDeviceNumberOfEntries
    - Device.WiFi.AccessPoint.2.AssociatedDeviceNumberOfEntries
    - Device.WiFi.SSID.1.Status
    - Device.WiFi.SSID.2.Status
  connectionRequest:
    - Device.DeviceInfo.UpTime
