# Calix GigaSpire BLAST u6, TR-181 (Device.*) profile.
#
# A carrier-managed Wi-Fi 6 system, and the profile the USP cohort
# runs: a directory profile gives a TR-369 agent a real data model
# (WiFi, hosts, interfaces) instead of the bare identity a minimal
# single-file profile produces, which is the difference between a USP
# device that can be provisioned and one that can only be counted.
#
# The tree keeps Device.ManagementServer so the same profile can run as
# either a CWMP cohort or a USP cohort, matching the convention the
# minimal TR-181 example already sets. A real TR-369-only agent would
# not expose that subtree, and provisioning rules scoped to USP must
# not read canonical.mgmt.* for exactly that reason.
#
# Modelled from public operator catalogues, not from a device capture.
# The published catalogues name the BLAST u6 family without committing
# an exact submodel, so ProductClass carries the family name. The OUI
# is the documentation OUI (00005E) rather than a Calix registration.

deviceIdPaths:
  manufacturer: Device.DeviceInfo.Manufacturer
  oui:          Device.DeviceInfo.ManufacturerOUI
  productClass: Device.DeviceInfo.ProductClass
  serialNumber: Device.DeviceInfo.SerialNumber

fleet:
  count: 1
  serialPattern: "CXNK{cpe:hex:8}"
  pools:
    wan_ipv4:
      type: ipv4
      cidr: "100.64.0.0/10"
    wan_ipv6:
      type: ipv6
      cidr: "2001:db8:6::/64"
    delegated_prefix:
      type: ipv6prefix
      super: "2001:db8:a000::/36"
      sublen: 56

periodicInformPaths:
  interval: Device.ManagementServer.PeriodicInformInterval
  enable:   Device.ManagementServer.PeriodicInformEnable

# ACS auth identity read live from the tree, so credential rotation
# via SetParameterValues lands on the next session. Empty values fall
# back to --acs-username/--acs-password.
acsCredentialPaths:
  username: Device.ManagementServer.Username
  password: Device.ManagementServer.Password

# A Download with FileType "1 Firmware Upgrade Image" is applied for
# real: the image is fetched, its declared version written to
# versionPath after a dark window, and announced in a boot session. An
# ACS campaign against this profile therefore changes what the device
# reports, which is what a compliance finding or a catalogue count is
# read against.
transfer:
  firmware:
    versionPath: Device.DeviceInfo.SoftwareVersion
    applyDelay: 60s
    fetch: true

# The TR-157 software module lifecycle, on CWMP (ChangeDUState) and USP
# (InstallDU(), Update(), Uninstall()). The object and its tables are in
# softwaremodules.yaml; an installed app adds its own objects to the
# tree for as long as it is installed.
softwareModules:
  path: Device.SoftwareModules.
  installDelay: 5s
  uninstallDelay: 1s

informParameters:
  bootstrap:
    - Device.DeviceInfo.Manufacturer
    - Device.DeviceInfo.ManufacturerOUI
    - Device.DeviceInfo.ModelName
    - Device.DeviceInfo.ProductClass
    - Device.DeviceInfo.SerialNumber
    - Device.DeviceInfo.HardwareVersion
    - Device.DeviceInfo.SoftwareVersion
    - Device.ManagementServer.URL
    - Device.ManagementServer.ParameterKey
    - Device.IP.Interface.1.IPv4Address.1.IPAddress
  boot:
    # SoftwareVersion is a forced Inform parameter (TR-069 Annex A),
    # and it is the boot after a firmware Download where it matters:
    # without it the ACS learns the new build on the next periodic
    # Inform, up to an interval later.
    - Device.DeviceInfo.SoftwareVersion
    - Device.DeviceInfo.UpTime
  periodic:
    # Identity repeats on every periodic Inform, not just bootstrap.
    # Model and firmware reach the device row through identity
    # enrichment, which reads the Inform's own parameter list, so a
    # device whose bootstrap the ACS missed (restart, re-registration,
    # a fleet that predates the profile) would otherwise carry a blank
    # model for the rest of its life. Real CPEs report these every
    # session for the same reason.
    - Device.DeviceInfo.ModelName
    - Device.DeviceInfo.SoftwareVersion
    - Device.DeviceInfo.UpTime
    - Device.Ethernet.Interface.1.Stats.BytesSent
    - Device.Ethernet.Interface.1.Stats.BytesReceived
    - Device.Ethernet.Interface.1.Stats.ErrorsReceived
    - Device.Ethernet.Interface.1.Stats.PacketsReceived
  valueChange:
    - Device.WiFi.AccessPoint.1.AssociatedDeviceNumberOfEntries
    - Device.WiFi.AccessPoint.2.AssociatedDeviceNumberOfEntries
  connectionRequest:
    - Device.DeviceInfo.UpTime

# faults.link is the uplink outage: SIGUSR1 takes the WAN away for the
# window below, without the broker being told, so a controller has to
# notice from its own keepalive the way it would on a real cut. Nothing
# happens until the process is signalled. reboot stays false because a
# cut uplink does not restart a router, and a controller comparing the
# uptime either side of the outage is entitled to see that.
faults:
  link:
    interface: Device.IP.Interface.1
    # Long enough to watch. The broker notices the lost session anywhere
    # from a few seconds to ninety after the cut, depending on where in
    # the keepalive cycle it lands, and a controller that groups silences
    # into incidents does so on its own tick; with two minutes the window
    # in which an incident can open was sometimes a few seconds wide.
    duration: 5m
    # The first fifty agents of the process only (instances count from one): a demonstration is one
    # estate going dark, not every home in the cohort, and a thousand
    # agents dropping at once says less about the controller than fifty.
    instances: 1-50
    reboot: false
