# ADSLLineTest on the FRITZ!Box: the one model in the fleet whose real
# hardware ships DSL, so this is where the loop diagnostic belongs. Per
# subcarrier arrays kept short (16 values), the normalizer only counts
# them, and the scalar attenuations carry per-band figures shaped like
# a real VDSL2 loop.

parameters:
  - path: Device.DSL.Diagnostics.ADSLLineTest.DiagnosticsState
    value: "None"
    writable: true
  - path: Device.DSL.Diagnostics.ADSLLineTest.Interface
    value: "Device.DSL.Line.1"
    writable: true
  - path: Device.DSL.Diagnostics.ADSLLineTest.LATNpbds
    value: "14.2,21.8,32.5"
  - path: Device.DSL.Diagnostics.ADSLLineTest.LATNpbus
    value: "8.1,19.4,30.2"
  - path: Device.DSL.Diagnostics.ADSLLineTest.SATNds
    value: "13.9,21.1,31.7"
  - path: Device.DSL.Diagnostics.ADSLLineTest.SATNus
    value: "7.8,18.9,29.6"
  - path: Device.DSL.Diagnostics.ADSLLineTest.HLOGpsds
    value: "-12.1,-12.4,-13.0,-13.8,-14.9,-16.2,-17.8,-19.6,-21.7,-24.0,-26.5,-29.2,-32.1,-35.2,-38.5,-42.0"
  - path: Device.DSL.Diagnostics.ADSLLineTest.HLOGpsus
    value: "-10.8,-11.2,-11.9,-12.8,-14.0,-15.4,-17.0,-18.9,-21.0,-23.3,-25.8,-28.5,-31.4,-34.5,-37.8,-41.3"
  - path: Device.DSL.Diagnostics.ADSLLineTest.QLNpsds
    value: "-138,-137,-138,-136,-135,-137,-138,-134,-121,-119,-133,-137,-138,-136,-137,-138"
  - path: Device.DSL.Diagnostics.ADSLLineTest.SNRpsds
    value: "38.1,37.8,36.9,35.5,33.8,31.9,29.7,27.3,24.7,21.9,19.0,16.0,12.9,9.7,6.5,3.2"

diagnostics:
  - statePath: Device.DSL.Diagnostics.ADSLLineTest.DiagnosticsState
    trigger: Requested
    complete: Complete
    duration: 45s
