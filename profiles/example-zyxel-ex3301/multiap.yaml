        writable: true
        generator:
          type: wallclock
          interval: 60s

  # What the controller's steering has done since boot: 802.11v BTM
  # requests and client blacklisting, with the success counts beside
  # the attempts. A controller that never steered reports zeros; this
  # one steers a little, which is what a two-extender home produces.
  - prefix: Device.WiFi.DataElements.Network.MultiAPSteeringSummaryStats
    parameters:
      - path: NoCandidateAPFailures
        type: xsd:unsignedInt
        value: "{cpe:rpick:0,0,1,3}"
      - path: BlacklistAttempts
        type: xsd:unsignedInt
        value: "{cpe:rpick:0,0,2,5}"
      - path: BlacklistSuccesses
        type: xsd:unsignedInt
        value: "{cpe:rpick:0,0,2,4}"
      - path: BlacklistFailures
        type: xsd:unsignedInt
        value: "{cpe:rpick:0,0,0,1}"
      - path: BTMAttempts
        type: xsd:unsignedInt
        value: "{cpe:rpick:4,9,17,31,52}"
      - path: BTMSuccesses
        type: xsd:unsignedInt
        value: "{cpe:rpick:3,7,14,24,41}"
      - path: BTMFailures
        type: xsd:unsignedInt
        value: "{cpe:rpick:1,2,3,7,11}"
      - path: BTMQueryResponses
