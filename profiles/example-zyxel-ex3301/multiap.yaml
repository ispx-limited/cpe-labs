  # ================= Device.WiFi.DataElements =================
  - prefix: Device.WiFi.DataElements.Network
    parameters:
      - path: ID
        value: "zyxel-mesh-{cpe:hex:6}"
      - path: ControllerID
        value: "00:00:5E:{cpe:mac:3}"
      - path: DeviceNumberOfEntries
