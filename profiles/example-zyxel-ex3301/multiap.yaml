  # Gateway fronthaul clients as MultiAP sees them: the same stations as
  # Device.WiFi.AccessPoint.{1,2}.AssociatedDevice, per band, with the
  # dBm signal those profiles read.
  - path: Device.WiFi.MultiAP.APDevice.1.Radio.1.AP.1.AssociatedDevice
    instances: 2
    parameters:
      - path: MACAddress
        value: "A2:00:0{i}:{cpe:mac:3}"
      - path: SignalStrength
        type: xsd:int
        value: "-57"
        writable: true
        generator:
          type: drift
          interval: 60s
          min: -82
          max: -41
          stepMax: 4
      - path: LastDataDownlinkRate
        type: xsd:unsignedInt
        value: "{cpe:rpick:573500,286800,229400,114700}"
  - path: Device.WiFi.MultiAP.APDevice.1.Radio.2.AP.1.AssociatedDevice
    instances: 3
