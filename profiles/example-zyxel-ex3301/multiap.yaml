# Device.WiFi.MultiAP.* and Device.WiFi.DataElements.*: the mesh.
#
# Three agents, so an ACS sees an actual mesh rather than a gateway
# with a flag set:
#
#   APDevice.1 / Network.Device.1  this gateway, the EasyMesh controller
#   APDevice.2 / Network.Device.2  a WX3100-T0 on the landing, wireless
#                                  5 GHz backhaul to the gateway
#   APDevice.3 / Network.Device.3  a WX3100-T0 in the office, Ethernet
#                                  backhaul into LAN port 2
#
# Both trees describe the same mesh because firmware of this generation
# exposes both: Device.WiFi.MultiAP is what older multi-AP telemetry
# profiles read and is deleted in TR-181 2.21, Device.WiFi.DataElements
# is the Wi-Fi Alliance Data Elements tree that replaces it and the one
# worth investing in. The MultiAP.APDevice identity fields follow the
# vendor-flavoured shape those profiles request (Manufacturer,
# ModelName, SerialNumber, SignalStrength in dBm); Data Elements follows
# TR-181 2.21 (CurrentOperatingClassProfile rather than the older
# CurrentOperatingClasses, STA and backhaul SignalStrength as RCPI, 0 to
# 220 with dBm = raw/2 - 110, Noise as ANPI).
#
# MACs line up across the profile so an ACS can join by address: the
# controller's AL MAC is the gateway's base MAC (ethernet.yaml), its
# BSSIDs are the SSID table's (wifi.yaml), the extenders' bridge MACs
# are their rows in the host table (hosts.yaml), the landing extender's
# backhaul radio is station 4 on the gateway's 5 GHz access point, and
# every client STA is a host.

parameters:
  - path: Device.WiFi.MultiAP.APDeviceNumberOfEntries
    type: xsd:unsignedInt
    value: "3"

groups:
  # ================= Device.WiFi.MultiAP =================
  # APDevice.1, the gateway. SignalStrength is backhaul RSSI toward the
  # controller; the gateway is the controller, so it reports 0.
  - prefix: Device.WiFi.MultiAP.APDevice.1
    parameters:
      - path: MACAddress
        value: "00:00:5E:{cpe:mac:3}"
      - path: Manufacturer
        value: "Zyxel"
      - path: ManufacturerOUI
        value: "00005E"
      - path: ModelName
        value: "EX3301-T0"
      - path: SerialNumber
        value: "S2042{cpe:ALNUM:8}"
      - path: SoftwareVersion
        value: "V5.50(ABVY.7.2)C0"
      - path: SignalStrength
        type: xsd:int
        value: "0"
  - prefix: Device.WiFi.MultiAP.APDevice.1.Radio.1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
      - path: OperatingFrequencyBand
        value: "2.4GHz"
      - path: Channel
        type: xsd:unsignedInt
        value: "6"
  - prefix: Device.WiFi.MultiAP.APDevice.1.Radio.1.AP.1
    parameters:
      - path: BSSID
        value: "02:00:5E:{cpe:mac:3}"
      - path: SSID
        value: "Zyxel_{cpe:HEX:4}"
  - prefix: Device.WiFi.MultiAP.APDevice.1.Radio.2
