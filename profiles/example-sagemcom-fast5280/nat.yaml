# Device.NAT.*, address translation.
#
# Three port forwards, because that is what a lived-in home has: a
# media server, a console and a camera, each reachable from outside.
# A table that ships empty is faithful to a gateway fresh out of the
# box and to nothing an ISP ever sees in service. Leaf set follows
# TR-181 2.20.1 Device.NAT.PortMapping.{i}; the forwards point at the
# WAN data path, Device.IP.Interface.2.
#
# The leaves that differ per forward are declared per instance below:
# the loader rejects a group that redeclares a path a table already
# materialized, so a per-row value cannot be a table default with an
# override.

parameters:
  - path: Device.NAT.InterfaceSettingNumberOfEntries
    type: xsd:unsignedInt
    value: "0"
  - path: Device.NAT.PortMappingNumberOfEntries
    type: xsd:unsignedInt
    value: "3"
  - path: Device.NAT.MaxNumberOfPortMappings
    type: xsd:unsignedInt
    value: "64"

objects:
  - path: Device.NAT.PortMapping
    instances: 3
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Enabled"
      - path: Alias
        value: "cpe-map-{i}"
        writable: true
      - path: Interface
        value: "Device.IP.Interface.2"
        writable: true
      - path: AllInterfaces
        type: xsd:boolean
        value: "false"
        writable: true
      - path: LeaseDuration
        type: xsd:unsignedInt
        value: "0"
        writable: true
      - path: RemainingLeaseTime
        type: xsd:unsignedInt
        value: "0"
      - path: RemoteHost
        value: ""
        writable: true
      - path: ExternalPortEndRange
        type: xsd:unsignedInt
        value: "0"
        writable: true

groups:
  - prefix: Device.NAT.PortMapping.1
    parameters:
      - path: Description
        value: "Plex media server"
        writable: true
      - path: Protocol
        value: "TCP"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "32400"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "32400"
        writable: true
      - path: InternalClient
        value: "192.168.1.20"
        writable: true
  - prefix: Device.NAT.PortMapping.2
    parameters:
      - path: Description
        value: "Game console"
        writable: true
      - path: Protocol
        value: "UDP"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "3074"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "3074"
        writable: true
      - path: InternalClient
        value: "192.168.1.31"
        writable: true
  - prefix: Device.NAT.PortMapping.3
    parameters:
      - path: Description
        value: "Home camera"
        writable: true
      - path: Protocol
        value: "TCP"
        writable: true
      - path: ExternalPort
        type: xsd:unsignedInt
        value: "8443"
        writable: true
      - path: InternalPort
        type: xsd:unsignedInt
        value: "443"
        writable: true
      - path: InternalClient
        value: "192.168.1.40"
        writable: true
