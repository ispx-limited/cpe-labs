# Device.IP.*, IP layer interfaces.
# Two interfaces: 1 = LAN bridge (192.168.1.0/24), 2 = WAN (PPPoE-assigned IPv4 + IPv6).

parameters:
  - path: Device.IP.IPv4Capable
    type: xsd:boolean
    value: "true"
  - path: Device.IP.IPv4Enable
    type: xsd:boolean
    value: "true"
    writable: true
  - path: Device.IP.IPv6Capable
    type: xsd:boolean
    value: "true"
  - path: Device.IP.IPv6Enable
    type: xsd:boolean
    value: "true"
    writable: true
  - path: Device.IP.InterfaceNumberOfEntries
    type: xsd:unsignedInt
    value: "2"

objects:
  - path: Device.IP.Interface
    instances: 2
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Up"
      - path: Alias
        value: "IP_{i}"
        writable: true
      - path: Name
        value: "ip{i}"
      - path: LastChange
        type: xsd:unsignedInt
        value: "0"
      - path: LowerLayers
        value: ""
        writable: true
      - path: Type
        value: "Normal"
      - path: Loopback
        type: xsd:boolean
        value: "false"
        writable: true
      - path: IPv4Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: IPv6Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: IPv4AddressNumberOfEntries
        type: xsd:unsignedInt
        value: "1"
      - path: IPv6AddressNumberOfEntries
        type: xsd:unsignedInt
        value: "1"
      - path: MaxMTUSize
        type: xsd:unsignedInt
        value: "1500"
        writable: true
      - path: CurrentMTUSize
        type: xsd:unsignedInt
        value: "1492"
      - path: Reset
        type: xsd:boolean
        value: "false"
        writable: true

  # ---- LAN side: static gateway address ----
  - path: Device.IP.Interface.1.IPv4Address
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Enabled"
      - path: AddressingType
        value: "Static"
        writable: true
      - path: IPAddress
        value: "192.168.1.1"
        writable: true
      - path: SubnetMask
        value: "255.255.255.0"
        writable: true
      - path: Alias
        value: "LAN_ADDRESS"
        writable: true

  # ---- WAN side: PPP-assigned, drawn per CPE from the declared pool ----
  - path: Device.IP.Interface.2.IPv4Address
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Enabled"
      - path: AddressingType
        value: "IPCP"
        writable: true
      - path: IPAddress
        value: "{wan_ipv4}"
        writable: true
      - path: SubnetMask
        value: "255.255.255.255"
        writable: true
      - path: Alias
        value: "WAN_ADDRESS"
        writable: true

  - path: Device.IP.Interface.2.IPv6Address
    instances: 1
    parameters:
      - path: Enable
        type: xsd:boolean
        value: "true"
        writable: true
      - path: Status
        value: "Preferred"
      - path: IPAddress
        value: "{wan_ipv6}"
        writable: true
      - path: Origin
        value: "AutoConfigured"
      - path: Alias
        value: "WAN_V6_ADDRESS"
        writable: true
